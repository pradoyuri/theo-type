<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Quiz analítico para descobrir seu perfil de aprendizagem teológica.">
  <title>10 Perfis de Estudantes de Teologia</title>
  <style>
    :root{--ink:#172027;--paper:#f4f0e8;--cream:#ebe4d7;--gold:#bd713d;--line:#cfc7b9;--muted:#687078}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button{font:inherit}.page{min-height:100vh}.shell{max-width:1440px;margin:auto;padding:30px 5vw 20px;display:flex;flex-direction:column;min-height:100vh}.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:800;letter-spacing:.12em}.brand>span:last-child>span{color:var(--gold)}.mark{width:34px;height:34px;display:grid;place-items:center;background:var(--ink);color:var(--paper);font:italic 22px Georgia,serif}.intro{flex:1;display:grid;grid-template-columns:1.05fr .95fr;gap:5vw;align-items:center;padding:5vh 0}.kicker{color:var(--gold);font-size:11px;letter-spacing:.19em;font-weight:800;display:flex;align-items:center;gap:12px}.kicker:before{content:"";width:35px;height:1px;background:var(--gold)}h1,h2{font-family:Georgia,serif;font-weight:500}.intro h1{font-size:clamp(52px,6.4vw,98px);line-height:.92;letter-spacing:-.055em;margin:24px 0 28px}.intro h1 em{color:var(--gold);font-weight:400}.intro-copy>p{max-width:610px;color:#586169;font:18px/1.7 Georgia,serif}.actions{display:flex;align-items:center;gap:24px;margin-top:35px}.primary{background:var(--ink);color:#fff;border:0;min-height:54px;padding:0 24px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:28px;cursor:pointer;transition:.2s}.primary:hover{background:var(--gold);transform:translateY(-1px)}.primary:disabled{opacity:.28;pointer-events:none}.time{font-size:12px;color:var(--muted)}.orbit{position:relative;min-height:590px}.orbit:before,.orbit:after{content:"";position:absolute;border:1px solid #d8d0c3;border-radius:50%;inset:11%}.orbit:after{inset:26%;border-style:dashed}.orbit-center{position:absolute;inset:38%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;background:var(--ink);color:#fff;z-index:2}.orbit-center b{font:70px/.9 Georgia,serif}.orbit-center small{color:#d3a17e;text-transform:uppercase;letter-spacing:.2em}.orb{position:absolute;width:104px;height:104px;background:#faf8f3;border:1px solid #d9d1c4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;box-shadow:0 10px 30px #1720270c;z-index:3}.orb b{color:var(--gold);font:28px Georgia,serif}.orb span{font-size:9px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;text-align:center}.o1{left:42%;top:0}.o2{right:5%;top:13%}.o3{right:0;top:43%}.o4{right:12%;bottom:3%}.o5{left:43%;bottom:-2%}.o6{left:6%;bottom:4%}.o7{left:0;top:43%}.o8{left:8%;top:12%}.o9{left:26%;top:25%;width:90px;height:90px}.o10{right:23%;bottom:25%;width:90px;height:90px}.intro-footer{border-top:1px solid var(--line);padding-top:17px;display:flex;justify-content:space-between;font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#808077}.topbar{height:86px;padding:0 5vw;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid var(--line)}.ghost{border:0;background:transparent;cursor:pointer;color:var(--ink);justify-self:start;font-size:22px}.counter,.restart{justify-self:end;font-size:12px;letter-spacing:.12em}.restart{border:0;background:none;cursor:pointer;font-weight:700}.progress{height:3px;background:#ded7cb}.progress i{display:block;height:100%;background:var(--gold);transition:width .35s}.question{max-width:940px;margin:auto;padding:8vh 24px 4vh}.heading{display:grid;grid-template-columns:75px 1fr;gap:28px;margin-bottom:38px}.num,.section-num{color:var(--gold);font:italic 50px/1 Georgia,serif}.heading h1{font-size:clamp(30px,3.5vw,49px);line-height:1.15;letter-spacing:-.025em;margin:18px 0 12px}.heading p{color:var(--muted);margin:0;font-family:Georgia,serif}.options{display:grid;gap:12px;margin-left:103px}.option{border:1px solid var(--line);background:#f8f5ef;min-height:72px;padding:12px 18px;display:grid;grid-template-columns:42px 1fr 28px;gap:14px;align-items:center;text-align:left;cursor:pointer;color:#3d464d;transition:.18s}.option:hover{border-color:var(--gold);transform:translateX(3px)}.option.selected{background:var(--ink);color:#fff;border-color:var(--ink)}.letter{width:34px;height:34px;border:1px solid #bfb7aa;display:grid;place-items:center;font-size:11px;font-weight:800}.option.selected .letter{border-color:#bc7446;color:#e1a77f}.check{color:#e1a77f}.quiz-actions{margin:28px 0 0 103px;display:flex;justify-content:space-between}.secondary{border:0;background:none;font-size:12px;font-weight:700;cursor:pointer}.quiz-footer{text-align:center;padding:24px;color:#88867f;font-size:11px}.result-hero{background:var(--ink);color:#fff;text-align:center;padding:70px 24px 80px}.label,.card>span,.cta span{color:#d79567;font-size:10px;letter-spacing:.2em;font-weight:800}.result-icon{width:76px;height:76px;border:1px solid #c47745;border-radius:50%;display:grid;place-items:center;margin:28px auto;color:#dfa071;font:34px Georgia,serif}.result-hero h1{font-size:clamp(48px,6vw,84px);margin:0;letter-spacing:-.03em}.tagline{color:#d89a6e;font:italic 21px Georgia,serif;margin:12px 0 25px}.description{max-width:710px;margin:auto;color:#cfd3d5;font:18px/1.7 Georgia,serif}.cards{max-width:1100px;margin:-34px auto 70px;display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:0 24px;position:relative}.card{background:#faf8f3;border:1px solid var(--line);padding:32px;box-shadow:0 18px 50px #17202710}.card h2{font-size:25px;margin:14px 0}.card p,.affinity p,.cta p{color:var(--muted);line-height:1.65;font-size:14px}.affinity{max-width:1100px;margin:0 auto 70px;padding:0 24px;display:grid;grid-template-columns:.8fr 1.2fr;gap:70px}.affinity h2,.cta h2{font-size:38px;margin:10px 0}.bar-row{display:grid;grid-template-columns:35px 140px 1fr 42px;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--line);font-size:12px}.rank{color:var(--gold);font:italic 14px Georgia,serif}.bar{height:5px;background:#ddd5c8}.bar i{display:block;height:100%;background:var(--gold)}.cta{background:var(--cream);padding:54px max(5vw,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:50px}.cta>div{max-width:680px}@media(max-width:900px){.intro{grid-template-columns:1fr}.orbit{min-height:470px}.intro h1{font-size:58px}.cards,.affinity{grid-template-columns:1fr}.affinity{gap:25px}.cta{align-items:flex-start;flex-direction:column}.orb{width:84px;height:84px}.orb span{font-size:8px}.orbit-center b{font-size:52px}}@media(max-width:640px){.shell{padding:22px 20px}.intro{padding-top:60px}.intro h1{font-size:48px}.actions{align-items:flex-start;flex-direction:column}.orbit{display:none}.intro-footer{gap:20px}.topbar{padding:0 20px}.question{padding:45px 18px}.heading{grid-template-columns:1fr}.num{font-size:34px}.options,.quiz-actions{margin-left:0}.option{grid-template-columns:38px 1fr 20px;min-height:82px}.quiz-actions{gap:10px}.primary{padding:0 16px;gap:14px}.cards{margin-top:-25px}.result-hero{padding-top:50px}.bar-row{grid-template-columns:30px 105px 1fr 35px}.cta{padding:45px 24px}}
  </style>
</head>
<body><div id="app"></div>
<script>
const P={sistematico:{n:'Sistemático',i:'▦',t:'O arquiteto das grandes ideias',d:'Você busca coerência, conexões e uma visão ampla da fé. Sua mente organiza doutrinas em estruturas claras e gosta de enxergar como cada parte da teologia conversa com o todo.',f:'Síntese e organização conceitual',c:'Teologia Sistemática, dogmática e docência'},exegetico:{n:'Exegético',i:'⌕',t:'O investigador do texto',d:'Você se energiza ao observar detalhes, comparar traduções e investigar o sentido original de uma passagem. Para você, boas conclusões começam com leitura atenta.',f:'Rigor textual e atenção aos detalhes',c:'Exegese bíblica e pesquisa acadêmica'},historiador:{n:'Historiador',i:'⌛',t:'O guardião da memória',d:'Você entende o presente à luz do caminho percorrido. Contextos, movimentos, concílios e biografias ajudam você a perceber padrões e evitar respostas sem raízes.',f:'Consciência histórica e contextual',c:'História da Igreja e pesquisa documental'},apologeta:{n:'Apologeta',i:'◇',t:'O defensor da fé',d:'Você gosta de enfrentar perguntas difíceis com honestidade, lógica e clareza. Seu impulso é construir pontes entre convicção, evidências e as dúvidas reais das pessoas.',f:'Argumentação e comunicação persuasiva',c:'Apologética, cosmovisão e diálogo público'},filosofo:{n:'Filósofo',i:'∞',t:'O explorador das perguntas fundamentais',d:'Você não foge das grandes questões sobre verdade, existência, conhecimento e Deus. Prefere compreender premissas antes de aceitar respostas rápidas.',f:'Pensamento crítico e profundidade',c:'Filosofia da religião e ética'},pastoral:{n:'Pastoral',i:'♡',t:'O cuidador de pessoas',d:'Para você, teologia ganha vida quando consola, orienta e transforma comunidades. Você percebe pessoas antes de problemas e traduz conceitos em cuidado concreto.',f:'Escuta, aplicação e cuidado',c:'Teologia Pastoral, liderança e aconselhamento'},missiologo:{n:'Missiólogo',i:'◎',t:'O teólogo em movimento',d:'Você pensa além de fronteiras e se interessa por culturas, povos e comunicação do Evangelho. Sua teologia naturalmente pergunta: como isso chega ao outro?',f:'Visão intercultural e mobilização',c:'Missiologia e estudos interculturais'},hermeneuta:{n:'Hermeneuta',i:'↔',t:'O construtor de sentidos',d:'Você se interessa pela ponte entre texto, contexto e leitor. Gosta de avaliar interpretações e de encontrar aplicações fiéis sem ignorar a complexidade.',f:'Interpretação e mediação de contexto',c:'Hermenêutica, ensino e homilética'},patristico:{n:'Patrístico',i:'✦',t:'O ouvinte da Igreja antiga',d:'Você encontra riqueza nos primeiros séculos da fé cristã. Credos, debates e autores antigos oferecem a você uma conversa viva para pensar o presente.',f:'Tradição, fontes antigas e continuidade',c:'Patrística, teologia histórica e espiritualidade'},linguista:{n:'Hebraísta/Grecista',i:'α',t:'O decifrador das línguas bíblicas',d:'Palavras, sintaxe e nuances fascinam você. Seu prazer está em chegar mais perto do texto bíblico por meio do hebraico, do aramaico e do grego.',f:'Precisão linguística e análise gramatical',c:'Línguas bíblicas, tradução e crítica textual'}};
const Q=[
['SEU JEITO DE APRENDER','Você abre um livro de teologia pela primeira vez. O que procura?','Escolha a alternativa que mais se aproxima do seu impulso natural.',[['Entender a estrutura geral e como os temas se conectam.',{sistematico:3,hermeneuta:1}],['Examinar as passagens bíblicas citadas e conferir o contexto.',{exegetico:3,linguista:1}],['Descobrir quando e por que essas ideias surgiram.',{historiador:3,patristico:1}],['Perguntar como o conteúdo ajuda pessoas e comunidades hoje.',{pastoral:3,missiologo:1}]]],
['DIANTE DE UMA DÚVIDA','Alguém questiona uma crença cristã importante. Sua primeira reação é…','Não pense no que seria ideal; escolha o que você faria espontaneamente.',[['Organizar uma resposta lógica, clara e apoiada em evidências.',{apologeta:3,filosofo:1}],['Ouvir com atenção para entender a história por trás da pergunta.',{pastoral:3,hermeneuta:1}],['Investigar o que o texto bíblico realmente afirma.',{exegetico:2,linguista:2}],['Explorar as premissas: o que entendemos por verdade e crença?',{filosofo:3,sistematico:1}]]],
['NA BIBLIOTECA','Qual destas descobertas faria você perder a noção do tempo?','Imagine uma tarde livre, sem prazos.',[['Um manuscrito com variantes em grego ou hebraico.',{linguista:3,exegetico:1}],['Cartas e documentos de um movimento cristão esquecido.',{historiador:3,patristico:1}],['Um debate clássico sobre existência, liberdade e Deus.',{filosofo:3,apologeta:1}],['Um modelo que relaciona criação, queda, redenção e esperança.',{sistematico:3,hermeneuta:1}]]],
['EM SALA DE AULA','Qual atividade desperta o melhor de você?','Pense na atividade em que sua contribuição seria mais natural.',[['Interpretar uma passagem considerando autor, público e propósito.',{hermeneuta:3,exegetico:1}],['Comparar respostas de diferentes épocas da Igreja.',{historiador:2,patristico:2}],['Criar um mapa visual de doutrinas e suas relações.',{sistematico:3,filosofo:1}],['Planejar como ensinar aquilo de modo acessível e transformador.',{pastoral:3,missiologo:1}]]],
['NA PRÁTICA','Uma comunidade enfrenta uma mudança cultural rápida. Você ajudaria…','Escolha o tipo de contribuição que mais combina com você.',[['Estudando a cultura para comunicar a fé com sensibilidade.',{missiologo:3,hermeneuta:1}],['Cuidando das pessoas afetadas e criando espaços de escuta.',{pastoral:3,missiologo:1}],['Analisando os argumentos e formulando uma resposta pública.',{apologeta:3,filosofo:1}],['Buscando paralelos históricos para aprender com a experiência da Igreja.',{historiador:3,patristico:1}]]],
['SEU CADERNO','Como suas anotações geralmente se parecem?','Escolha a imagem mais próxima da realidade.',[['Esquemas, categorias, setas e sínteses bem organizadas.',{sistematico:3,hermeneuta:1}],['Palavras sublinhadas, observações gramaticais e referências cruzadas.',{linguista:2,exegetico:2}],['Perguntas, contrapontos e argumentos nas margens.',{apologeta:2,filosofo:2}],['Aplicações, nomes de pessoas e ideias para ensinar ou cuidar.',{pastoral:3,missiologo:1}]]],
['VOZES DO PASSADO','Qual convite intelectual mais chama sua atenção?','Não é teste de conhecimento — é uma questão de curiosidade.',[['Ler Agostinho, Atanásio e Basílio em suas próprias controvérsias.',{patristico:3,historiador:1}],['Acompanhar a evolução de uma doutrina ao longo dos séculos.',{historiador:3,sistematico:1}],['Reconstruir o sentido de uma palavra no mundo bíblico.',{linguista:3,exegetico:1}],['Debater como ideias antigas respondem a dilemas atuais.',{filosofo:2,apologeta:2}]]],
['COMUNICAÇÃO','Quando você explica uma ideia complexa, tende a…','Pense em como as pessoas descrevem seu jeito de ensinar.',[['Construir o raciocínio passo a passo até a conclusão.',{apologeta:2,sistematico:2}],['Mostrar o contexto e as possíveis leituras antes de aplicar.',{hermeneuta:3,exegetico:1}],['Usar exemplos próximos da vida e das necessidades do ouvinte.',{pastoral:3,missiologo:1}],['Adaptar linguagem e referências ao universo cultural do público.',{missiologo:3,hermeneuta:1}]]],
['PROJETO IDEAL','Você pode escolher um projeto para um semestre. Qual seria?','Escolha pelo entusiasmo, não pela facilidade.',[['Produzir uma tradução comentada de um pequeno texto bíblico.',{linguista:3,exegetico:1}],['Criar um curso de formação e cuidado para líderes locais.',{pastoral:3,sistematico:1}],['Pesquisar a recepção de uma doutrina nos Pais da Igreja.',{patristico:3,historiador:1}],['Desenvolver uma resposta cristã a uma questão ética contemporânea.',{apologeta:2,filosofo:2}]]],
['O QUE MOVE VOCÊ','Ao final dos estudos, qual impacto lhe daria mais satisfação?','Esta resposta ajuda a identificar a direção predominante do seu perfil.',[['Ajudar alguém a ler e interpretar a Bíblia com mais fidelidade.',{hermeneuta:2,exegetico:2}],['Formar comunidades que cuidem melhor de pessoas reais.',{pastoral:3,sistematico:1}],['Levar o Evangelho a novos contextos com respeito e clareza.',{missiologo:3,apologeta:1}],['Produzir conhecimento sólido que atravesse gerações.',{historiador:1,patristico:1,filosofo:1,linguista:1}]]]
];
let screen='intro',current=0,answers=[],selected=null;const app=document.getElementById('app');
const brand=()=>'<div class="brand"><span class="mark">T</span><span>THEO<span>TYPE</span></span></div>';
function render(){if(screen==='intro')intro();else if(screen==='quiz')quiz();else result();window.scrollTo({top:0,behavior:'smooth'})}
function intro(){app.innerHTML=`<main class="shell">${brand()}<section class="intro"><div class="intro-copy"><div class="kicker">PERFIL DE APRENDIZAGEM TEOLÓGICA</div><h1>Qual é o seu<br><em>jeito de estudar</em><br>teologia?</h1><p>Responda a 10 perguntas de cenário e descubra quais campos da teologia mais combinam com sua curiosidade, seu método e sua vocação.</p><div class="actions"><button class="primary" onclick="start()">Começar diagnóstico <span>→</span></button><span class="time">◷ cerca de 4 minutos</span></div></div><div class="orbit"><div class="orbit-center"><b>10</b><small>perfis</small></div>${Object.values(P).map((p,i)=>`<div class="orb o${i+1}"><b>${p.i}</b><span>${p.n}</span></div>`).join('')}</div></section><footer class="intro-footer"><span>Uma ferramenta de autoconhecimento acadêmico</span><span>Não há respostas certas ou erradas</span></footer></main>`}
function start(){screen='quiz';current=0;answers=[];selected=null;render()}
function quiz(){const q=Q[current];app.innerHTML=`<main class="page"><header class="topbar"><button class="ghost" onclick="back()" aria-label="Voltar">←</button>${brand()}<span class="counter">${String(current+1).padStart(2,'0')} / 10</span></header><div class="progress"><i style="width:${(current+1)*10}%"></i></div><section class="question"><div class="heading"><span class="num">${String(current+1).padStart(2,'0')}</span><div><div class="kicker">${q[0]}</div><h1>${q[1]}</h1><p>${q[2]}</p></div></div><div class="options">${q[3].map((o,i)=>`<button class="option ${selected===i?'selected':''}" onclick="choose(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o[0]}</span><span class="check">${selected===i?'✓':''}</span></button>`).join('')}</div><div class="quiz-actions"><button class="secondary" onclick="back()">← Voltar</button><button class="primary" ${selected===null?'disabled':''} onclick="next()">${current===9?'Ver meu perfil':'Próxima pergunta'} <span>→</span></button></div></section><footer class="quiz-footer">Responda com sinceridade — não existem escolhas certas ou erradas.</footer></main>`}
function choose(i){selected=i;quiz()}
function next(){if(selected===null)return;answers.push(selected);if(current===9){screen='result'}else{current++;selected=null}render()}
function back(){if(current===0){screen='intro';selected=null}else{current--;selected=answers.pop();}render()}
function ranking(){const s=Object.fromEntries(Object.keys(P).map(k=>[k,0]));answers.forEach((a,qi)=>Object.entries(Q[qi][3][a][1]).forEach(([k,v])=>s[k]+=v));return Object.keys(P).sort((a,b)=>s[b]-s[a]).map(k=>({k,s:s[k],...P[k]}))}
function result(){const r=ranking(),top=r[0],max=Math.max(...r.map(x=>x.s),1);app.innerHTML=`<main class="page"><header class="topbar"><div></div>${brand()}<button class="restart" onclick="start()">↻ Refazer teste</button></header><section class="result-hero"><div class="label">SEU PERFIL PREDOMINANTE</div><div class="result-icon">${top.i}</div><h1>O ${top.n}</h1><p class="tagline">${top.t}</p><p class="description">${top.d}</p></section><section class="cards"><div class="card"><span>SEU DIFERENCIAL</span><h2>${top.f}</h2><p>Este resultado indica uma tendência, não uma caixa. Seu modo de estudar pode combinar diferentes tradições e amadurecer ao longo da formação.</p></div><div class="card"><span>CAMINHOS PARA EXPLORAR</span><h2>${top.c}</h2><p>Procure disciplinas, mentores e projetos práticos nessa direção — e mantenha diálogo com áreas complementares.</p></div></section><section class="affinity"><div><span class="section-num">02</span><h2>Seu mapa de afinidades</h2><p>Os três campos que mais apareceram nas suas escolhas.</p></div><div>${r.slice(0,3).map((x,i)=>`<div class="bar-row"><span class="rank">0${i+1}</span><b>${x.n}</b><div class="bar"><i style="width:${Math.max(18,x.s/max*100)}%"></i></div><span>${Math.round(x.s/max*100)}%</span></div>`).join('')}</div></section><section class="cta"><div><span>PRÓXIMO PASSO</span><h2>Transforme curiosidade em percurso.</h2><p>Use seu perfil para escolher leituras, disciplinas e experiências — sem deixar de cultivar as áreas que desafiam você.</p></div><button class="primary" onclick="start()">Refazer diagnóstico <span>↻</span></button></section></main>`}
render();
</script></body></html>
